  const overlays = [];

  function addPin(p, opts){
    const el = document.createElement("div");
    el.className = "pin" + (opts.home ? " home" : "") + (opts.show ? " show" : "");
    const st = STYLE[p.c] || {c:"#e8453c"};
    const emoji = opts.home ? "🏡" : (ICON[p.n] || st.e);
    el.innerHTML = `<div class="label">${esc(p.n)}</div><div class="dot" style="background:${opts.home?"#e8453c":st.c}"><span>${emoji}</span></div>`;
    el.onclick = () => {
      if (opts.home) { card.innerHTML = `<b>${esc(p.n)}</b><br>${esc(p.a)}`; }
      else {
        const walk = `https://map.kakao.com/link/by/walk/${encodeURIComponent("스타빌")},${HOME.lat},${HOME.lng}/${encodeURIComponent(p.n)},${p.lat},${p.lng}`;
        const far = p.w > 20; const car = `https://map.kakao.com/link/by/car/${encodeURIComponent("스타빌")},${HOME.lat},${HOME.lng}/${encodeURIComponent(p.n)},${p.lat},${p.lng}`; const mv = far ? `🚗 차량 ${p.d||""} <span style="color:#64748b;font-size:11px">(도보 20분 초과)</span>` : `🚶 도보 ${p.w}분 · <b style="color:#16a34a">도보가능</b>`; card.innerHTML = `<b>${esc(p.n)}</b> · ${mv}${p.pr?`<br>💰 ${esc(p.pr)}`:""}<br>${esc(p.a)}<br><a href="https://map.kakao.com/link/map/${p.id}" target="_blank">카카오맵에서 보기</a><a href="${far?car:walk}" target="_blank">${far?"차로 가는 길":"걸어가는 길"}</a>`;
      }
      card.style.display = "block";
    };
    const ov = new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(p.lat, p.lng), content:el, yAnchor:0, zIndex: opts.home?1:(opts.show?3:2)});
    ov.setMap(map);
    overlays.push({ov, p});
    return el;
  }

  addPin(HOME, {home:true, show:!focusId});

  if (focusId) {
    const p = PLACES.find(x => x.id === focusId);
    if (!p) { showMsg("장소를 찾지 못했어요."); return; }
    const el = addPin(p, {show:true});
    const b = new kakao.maps.LatLngBounds();
    b.extend(new kakao.maps.LatLng(HOME.lat, HOME.lng)); b.extend(new kakao.maps.LatLng(p.lat, p.lng));
    if (p.w <= 25) map.setBounds(b, 60, 60, 60, 60); else { map.setCenter(new kakao.maps.LatLng(p.lat, p.lng)); map.setLevel(4); }
    el.click();
  } else {
    PLACES.forEach(p => addPin(p, {}));
    overlays.forEach(o => { if (o.p !== HOME) o.ov.setMap(null); });   // 기본값: 분류 모두 꺼둠 (집만 표시)
    map.setLevel(5);
    // 분류 필터
    const lg = document.createElement("div"); lg.className = "legend";
    lg.innerHTML = Object.entries(STYLE).map(([k,v]) => `<label><input type="checkbox" data-c="${k}"> <span style="color:${v.c}">●</span> ${k}</label>`).join("");
    document.body.appendChild(lg);
    lg.addEventListener("change", e => {
      const c = e.target.dataset.c, on = e.target.checked;
      overlays.forEach(o => { if (o.p.c === c) o.ov.setMap(on ? map : null); });
    });
  }
  kakao.maps.event.addListener(map, "click", () => card.style.display = "none");
  // 가까이 확대하면(레벨 3 이하) 모든 핀에 이름표 표시
  const mapEl = document.getElementById("map");
  const syncLabels = () => mapEl.classList.toggle("near", map.getLevel() <= 3);
  kakao.maps.event.addListener(map, "zoom_changed", syncLabels); syncLabels();
}

if (!KAKAO_JS_KEY || KAKAO_JS_KEY.startsWith("여기에")) {
  showMsg("카카오 JavaScript 키를 넣으면 지도가 표시돼요.");
} else {
  const s = document.createElement("script");
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&autoload=false`;
  s.onload = () => kakao.maps.load(init);
  s.onerror = () => showMsg("카카오 지도를 불러오지 못했어요. 키와 등록한 사이트 도메인을 확인해 주세요.");
  document.head.appendChild(s);
}
</script>
</body>
</html>
