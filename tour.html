function showMsg(t){ document.body.insertAdjacentHTML("beforeend", `<div class="msg">${t}</div>`); }
function esc(s){ return String(s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function route(mode, p){ return `https://map.kakao.com/link/by/${mode}/${encodeURIComponent("스타빌")},${HOME.lat},${HOME.lng}/${encodeURIComponent(p.n)},${p.lat},${p.lng}`; }

function init(){
  const map = new kakao.maps.Map(document.getElementById("map"), {center:new kakao.maps.LatLng(HOME.lat, HOME.lng), level:7});
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  const card = document.getElementById("card");
  const overlays = [];

  function addPin(p, opts){
    const el = document.createElement("div");
    el.className = "pin" + (opts.home ? " home" : "") + (opts.show ? " show" : "");
    const st = STYLE[p.c] || {c:"#e8453c"};
    const emoji = opts.home ? "🏡" : (p.e || st.e);
    el.innerHTML = `<div class="label">${esc(p.n)}</div><div class="dot" style="background:${opts.home?"#e8453c":st.c}"><span>${emoji}</span></div>`;
    el.onclick = () => {
      if (opts.home) { card.innerHTML = `<b>${esc(p.n)}</b><br>${esc(p.a)}`; }
      else {
        card.innerHTML = `<b>${esc(p.n)}</b> · ${esc(p.c)}<br>${(p.w&&p.w<=20)?`🚶 도보 ${p.w}분 · <b style="color:#16a34a">도보가능</b><br>`:""}🚗 ${esc(p.car)}<br><span class="tr">🚌 ${esc(p.tr)}</span><br>${esc(p.a)}<br>`+
          `<a href="${p.u||('https://map.kakao.com/link/map/'+p.id)}" target="_blank">카카오맵</a>${(p.w&&p.w<=20)?`<a href="${route("walk",p)}" target="_blank">걸어가는 길</a>`:""}<a href="${route("car",p)}" target="_blank">차로 가는 길</a><a href="${route("traffic",p)}" target="_blank">대중교통 길</a>`;
      }
      card.style.display = "block";
    };
    const ov = new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(p.lat, p.lng), content:el, yAnchor:0, zIndex: opts.home?1:(opts.show?3:2)});
    ov.setMap(map);
    overlays.push({ov, p});
    return el;
  }

  addPin(HOME, {home:true, show:true});

  if (focusId) {
    const p = PLACES.find(x => x.id === focusId);
    if (!p) { showMsg("장소를 찾지 못했어요."); return; }
    const el = addPin(p, {show:true});
    const b = new kakao.maps.LatLngBounds();
    b.extend(new kakao.maps.LatLng(HOME.lat, HOME.lng)); b.extend(new kakao.maps.LatLng(p.lat, p.lng));
    map.setBounds(b, 70, 50, 70, 50);
    el.click();
  } else {
    PLACES.forEach(p => addPin(p, {}));
    overlays.forEach(o => { if (o.p !== HOME) o.ov.setMap(null); });   // 기본값: 분류 모두 꺼둠 (집만 표시)
    const lg = document.createElement("div"); lg.className = "legend";
    lg.innerHTML = Object.entries(STYLE).map(([k,v]) => {
      const n = PLACES.filter(p => p.c === k).length;
      return n ? `<label><input type="checkbox" data-c="${k}"> <span style="color:${v.c}">●</span> ${v.e} ${k} (${n})</label>` : "";
    }).join("") + `<label class="all"><input type="checkbox" data-all="1"> 전체 보기</label>`;
    document.body.appendChild(lg);
    const fit = () => {
      const vis = overlays.filter(o => o.p !== HOME && o.ov.getMap());
      if (!vis.length) { map.setCenter(new kakao.maps.LatLng(HOME.lat, HOME.lng)); map.setLevel(7); return; }
      const b = new kakao.maps.LatLngBounds(); b.extend(new kakao.maps.LatLng(HOME.lat, HOME.lng));
      vis.forEach(o => b.extend(new kakao.maps.LatLng(o.p.lat, o.p.lng)));
      map.setBounds(b, 60, 60, 60, 160);
    };
    lg.addEventListener("change", e => {
      if (e.target.dataset.all) {
        lg.querySelectorAll("input[data-c]").forEach(i => i.checked = e.target.checked);
        overlays.forEach(o => { if (o.p !== HOME) o.ov.setMap(e.target.checked ? map : null); });
      } else {
        const c = e.target.dataset.c, on = e.target.checked;
        overlays.forEach(o => { if (o.p.c === c) o.ov.setMap(on ? map : null); });
      }
      card.style.display = "none";
      fit();
    });
  }
  kakao.maps.event.addListener(map, "click", () => card.style.display = "none");
  const mapEl = document.getElementById("map");
  const syncLabels = () => mapEl.classList.toggle("near", map.getLevel() <= 4);
  kakao.maps.event.addListener(map, "zoom_changed", syncLabels); syncLabels();
}

const s = document.createElement("script");
s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&autoload=false`;
s.onload = () => kakao.maps.load(init);
s.onerror = () => showMsg("카카오 지도를 불러오지 못했어요.");
document.head.appendChild(s);
</script>
</body>
</html>
